name: Build Windows MSIX Installer

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create MSIX Installer
        run: dart run msix:create

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DerbyManager-Windows-MSIX
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: warn

      - name: Upload Windows build (portable)
        uses: actions/upload-artifact@v4
        with:
          name: DerbyManager-Windows-Portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: warn

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: DerbyManager-Windows-MSIX
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
