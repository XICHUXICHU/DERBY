<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Derby Pro | Actividad</title>
  <style>
    :root {
      --bg: #111827; --surface: #1F2937; --text: #F3F4F6;
      --muted: #9CA3AF; --border: #374151;
      --primary: #8B0000; --green: #10B981; --gold: #F59E0B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: var(--surface);
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar h1 { font-size: 18px; }
    .topbar a { color: var(--muted); font-size: 13px; text-decoration: none; }
    .topbar a:hover { color: var(--text); }

    .filters {
      display: flex; gap: 10px; padding: 16px 24px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: center;
    }
    .filters select, .filters input {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 13px; outline: none;
    }
    .filters select:focus, .filters input:focus { border-color: var(--primary); }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; padding: 20px 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 20px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 6px; }
    .stat-value { font-size: 28px; font-weight: bold; }
    .stat-value.green { color: var(--green); }
    .stat-value.gold { color: var(--gold); }

    .table-wrap { padding: 0 24px 32px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 14px; color: var(--muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
      border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(55,65,81,0.5);
      vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.025); }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: bold; letter-spacing: 0.04em;
    }
    .badge-open  { background: rgba(16,185,129,0.15); color: var(--green); }
    .badge-derby { background: rgba(245,158,11,0.15); color: var(--gold); }

    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--muted); }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-wrap { display: flex; align-items: center; justify-content: center;
      min-height: 100vh; }
    .login-box { background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 32px; width: 340px; }
    .login-box h2 { margin-bottom: 20px; font-size: 20px; }
    .login-box input { width: 100%; padding: 10px 12px; margin-bottom: 12px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; }
    .login-box button { width: 100%; padding: 12px; background: var(--primary);
      color: #fff; border: none; border-radius: 8px; font-size: 15px;
      font-weight: bold; cursor: pointer; }
    #login-error { color: #EF4444; font-size: 13px; margin-top: 8px; text-align: center; }

    button.btn-sm { background: transparent; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 12px; border-radius: 8px;
      font-size: 12px; cursor: pointer; }
    button.btn-sm:hover { border-color: var(--primary); color: var(--text); }

    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-section">
  <div class="login-box">
    <h2>Derby Pro Admin</h2>
    <input type="email" id="email" placeholder="Correo del administrador" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="btn-login">Ingresar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app-section" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html">← Panel de Licencias</a>
      <h1>Actividad de la App</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn-sm" id="btn-refresh">↻ Actualizar</button>
      <button class="btn-sm" id="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <div class="filters">
    <select id="filter-type">
      <option value="">Todos los eventos</option>
      <option value="app_open">Solo aperturas</option>
      <option value="derby_created">Solo derbys creados</option>
    </select>
    <input type="text" id="filter-license" placeholder="Filtrar por licencia..." style="width:220px" />
    <input type="text" id="filter-computer" placeholder="Filtrar por computadora..." style="width:200px" />
    <span id="count-label" style="margin-left:auto;font-size:13px;color:var(--muted)"></span>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total eventos</div>
      <div class="stat-value" id="s-total">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Aperturas de app</div>
      <div class="stat-value green" id="s-opens">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Derbys creados</div>
      <div class="stat-value gold" id="s-derbys">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">PCs únicas</div>
      <div class="stat-value" id="s-pcs">—</div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha y hora</th>
          <th>Evento</th>
          <th>Licencia</th>
          <th>Computadora</th>
          <th>Windows</th>
          <th>Derby</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty-msg" class="empty" style="display:none">Sin eventos registrados aún.</div>
    <div id="loading-msg" class="empty"><div class="spinner"></div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCPJDRLdiBW2J3gUDUUOynA-yVBJM-HKSI",
  authDomain: "derby2-6f83a.firebaseapp.com",
  projectId: "derby2-6f83a",
});
const auth = getAuth(app);
const db   = getFirestore(app);

let allEvents = [];

// ── Auth ─────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('app-section').style.display   = 'block';
    loadEvents();
  } else {
    document.getElementById('login-section').style.display = 'flex';
    document.getElementById('app-section').style.display   = 'none';
  }
});

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const pwd   = document.getElementById('password').value;
  document.getElementById('login-error').innerText = '';
  try { await signInWithEmailAndPassword(auth, email, pwd); }
  catch { document.getElementById('login-error').innerText = 'Credenciales incorrectas.'; }
});

document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
document.getElementById('btn-refresh').addEventListener('click', loadEvents);

// ── Carga de datos ───────────────────────────────────────────────────────────
async function loadEvents() {
  document.getElementById('loading-msg').style.display = 'block';
  document.getElementById('empty-msg').style.display   = 'none';
  document.getElementById('tbody').innerHTML = '';

  const q = query(
    collection(db, 'app_events'),
    orderBy('timestamp', 'desc'),
    limit(500)
  );
  const snap = await getDocs(q);
  allEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  document.getElementById('loading-msg').style.display = 'none';
  updateStats();
  renderTable();
}

// ── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  const opens  = allEvents.filter(e => e.type === 'app_open').length;
  const derbys = allEvents.filter(e => e.type === 'derby_created').length;
  const pcs    = new Set(allEvents.map(e => e.computer_name).filter(Boolean)).size;
  document.getElementById('s-total').innerText  = allEvents.length;
  document.getElementById('s-opens').innerText  = opens;
  document.getElementById('s-derbys').innerText = derbys;
  document.getElementById('s-pcs').innerText    = pcs;
}

// ── Tabla ────────────────────────────────────────────────────────────────────
function renderTable() {
  const typeF     = document.getElementById('filter-type').value;
  const licenseF  = document.getElementById('filter-license').value.toLowerCase();
  const computerF = document.getElementById('filter-computer').value.toLowerCase();

  const filtered = allEvents.filter(e => {
    const type     = e.type ?? '';
    const license  = e.license_code ?? '';
    const computer = e.computer_name ?? '';
    if (typeF     && type     !== typeF)                        return false;
    if (licenseF  && !license.toLowerCase().includes(licenseF)) return false;
    if (computerF && !computer.toLowerCase().includes(computerF)) return false;
    return true;
  });

  document.getElementById('count-label').innerText =
    `${filtered.length} de ${allEvents.length} eventos`;

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!filtered.length) {
    document.getElementById('empty-msg').style.display = 'block';
    return;
  }
  document.getElementById('empty-msg').style.display = 'none';

  filtered.forEach(e => {
    const type     = e.type ?? '';
    const ts       = e.timestamp
      ? e.timestamp.toDate().toLocaleString('es-MX')
      : '—';
    const license  = e.license_code ?? '—';
    const computer = e.computer_name ?? '—';
    const winver   = e.windows_version ?? '—';
    const derby    = e.derby_nombre ?? '';

    const badgeClass = type === 'app_open' ? 'badge-open' : 'badge-derby';
    const badgeLabel = type === 'app_open' ? 'Apertura' : 'Derby creado';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="mono">${ts}</td>
      <td><span class="badge ${badgeClass}">${badgeLabel}</span></td>
      <td class="mono">${license}</td>
      <td>${computer}</td>
      <td style="color:var(--muted);font-size:12px">${winver}</td>
      <td style="color:var(--gold)">${derby}</td>
    `;
    tbody.appendChild(tr);
  });
}

['filter-type','filter-license','filter-computer'].forEach(id =>
  document.getElementById(id).addEventListener('input', renderTable)
);
</script>
</body>
</html>
